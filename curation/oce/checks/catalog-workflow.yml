name: Maintain Catalog Measurement
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maintain-catalog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: maintain-catalog-${{ github.run_id }}
      OCC_POSTGRES_PORT: "0"
      npm_config_verify_deps_before_run: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
      - uses: ./.github/actions/setup-pnpm-store-cache
        with:
          node-version: "24.22.1"
          cache-mode: restore
      - name: Prepare normal pinned CI dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Start disposable canonical PostgreSQL
        run: docker compose -f compose.postgres.yaml up -d --wait
      - name: Measure actual native and restored catalogs
        run: |
          export CATALOG_CONTAINER="$(docker compose -f compose.postgres.yaml ps -q postgres)"
          node .maintain-catalog-probe.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: catalog-measurement
          path: catalog-measurement.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove only this run's database and volume
        if: always()
        run: docker compose -f compose.postgres.yaml down --volumes --remove-orphans
