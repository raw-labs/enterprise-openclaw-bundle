name: Validate bundle factory
on:
  pull_request:
  push:
    branches: [main]
env:
  BUNDLE_DISTRIBUTION_VISIBILITY: ${{ github.event.repository.private && 'private' || 'public' }}
permissions:
  contents: read
jobs:
  contributor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.16.0'
      - name: Run offline contributor checks without package credentials
        run: python3 scripts/check.py
  validate:
    needs: contributor
    # Credentials and paid runners never execute pull request code.
    if: github.repository == 'raw-labs/enterprise-openclaw-bundle' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-24.04-8
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.16.0'
      - uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.21.3
      - name: Check all definitions and preserve published history
        run: python3 scripts/release.py validate-definitions
      - name: Resolve source and dependencies for packaging tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py resolve --output .work/resolved
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.1'
          cache-dependency-path: .work/resolved/source/go.sum
      - name: Build and test the unchanged exact-source CLI
        run: python3 scripts/cli.py build --selection .work/resolved/candidate.json --source .work/resolved/source --output .work/resolved/cli
      - name: Test selected source confinement preparation
        run: env -u OCC_TEST_CODEX_APPARMOR_PROFILE node --test .work/resolved/source/tests/conformance/codex-seccomp-profile.test.mjs
      - name: Check rejection paths, provenance, reproducibility and actual chart rendering
        run: python3 scripts/check.py --integration
