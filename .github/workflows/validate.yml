name: Validate bundle factory
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: depot-ubuntu-24.04-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.16.0'
      - uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.21.3
      - name: Check all definitions and preserve published history
        run: python3 scripts/release.py validate-definitions
      - name: Resolve source and dependencies for packaging tests
        run: python3 scripts/release.py resolve --output .work/resolved
      - name: Check rejection paths, provenance, reproducibility and actual chart rendering
        run: python3 -m unittest discover -s tests -v
