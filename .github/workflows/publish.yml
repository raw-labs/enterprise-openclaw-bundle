name: Publish previously checked private candidate
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Exact agreed prerelease identity from the source build
        required: true
        type: string
      build_run_id:
        description: Successful build-only run whose exact OCI exports are approved for GHCR
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: candidate-${{ inputs.release_id }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'raw-labs/enterprise-openclaw-bundle' && github.event.repository.private
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.16.0'
      - uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.21.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-*
          path: .work/inputs
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Authenticate only the candidate publisher
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y skopeo
          mkdir -m 700 "$RUNNER_TEMP/registry-auth"
          printf '%s' "$REGISTRY_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/registry-auth/auth.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Publish the tested manifests and retain unqualified metadata
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/stock.py new --id "$RELEASE_ID" --output .work/candidate.json
          python3 scripts/stock.py --selection .work/candidate.json publish --inputs .work/inputs --output .work/published --authfile "$RUNNER_TEMP/registry-auth/auth.json" --build-run-id "$BUILD_RUN_ID"
          python3 scripts/stock.py --selection .work/published/candidate.json source --output .work/source
          python3 scripts/stock.py --selection .work/published/candidate.json dependencies --output .work/renderer-dependencies
          python3 scripts/bundle.py --release .work/published/candidate.json package --source .work/source --dependencies .work/renderer-dependencies --output dist/bundle.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: candidate-records-and-bundle
          path: |
            .work/published/*.json
            .work/published/profiles
            .work/published/defaults
            .work/published/overlays/notices.fragment
            dist/bundle.tar.gz*
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Remove job credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/registry-auth/auth.json"
