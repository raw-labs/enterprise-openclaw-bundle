name: Diagnose native sandbox
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/main' && github.event.repository.private
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.16.0'
      - run: bash scripts/setup-docker.sh
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: resolved-inputs
          run-id: 38815716584
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: inputs
      - name: Inspect Kubernetes AppArmor admission
        run: |
          tar -xzf inputs/resolved.tar.gz -C inputs
          source="$PWD/inputs/resolved/source"
          bash "$source/scripts/ci/setup-tools.sh" k3d
          export PATH="$RUNNER_TEMP/bin:$PATH"
          bash "$source/.github/actions/run-ci-lane/codex-sandbox.sh" load
          trap 'k3d cluster delete bundle-apparmor; bash "$source/.github/actions/run-ci-lane/codex-sandbox.sh" unload' EXIT
          uname -r
          k3d cluster create bundle-apparmor --image 'docker.io/rancher/k3s:v1.35.9-k3s1@sha256:ec9868c6a38d4e8c1869832fb5fd1eb8473c39794a0b44d2b952e7ba911951bc' --servers 1 --agents 0 --no-lb --wait --timeout 120s --kubeconfig-update-default=false --kubeconfig-switch-context=false
          export KUBECONFIG="$RUNNER_TEMP/bundle-apparmor-kubeconfig"
          k3d kubeconfig get bundle-apparmor > "$KUBECONFIG"
          kubectl apply -f - <<'JSON'
          {"apiVersion":"v1","kind":"Pod","metadata":{"name":"probe"},"spec":{"automountServiceAccountToken":false,"securityContext":{"runAsNonRoot":true,"runAsUser":1000,"runAsGroup":1000,"seccompProfile":{"type":"RuntimeDefault"}},"containers":[{"name":"probe","image":"registry.k8s.io/pause:3.10","securityContext":{"allowPrivilegeEscalation":false,"readOnlyRootFilesystem":true,"capabilities":{"drop":["ALL"]},"appArmorProfile":{"type":"Localhost","localhostProfile":"oce-ci-codex-sandbox"}}}]}}
          JSON
          kubectl wait --for=condition=Ready pod/probe --timeout=45s || true
          kubectl get pod probe -o json | python3 -c 'import json,sys; p=json.load(sys.stdin); print(json.dumps(p.get("status",{})))'
          kubectl get events --field-selector involvedObject.name=probe -o json | python3 -c 'import json,sys; print(json.dumps([{k:e.get(k) for k in ["reason","message"]} for e in json.load(sys.stdin)["items"]]))'
          docker exec k3d-bundle-apparmor-server-0 sh -c 'cat /sys/module/apparmor/parameters/enabled; grep oce-ci /sys/kernel/security/apparmor/profiles' || true
          sudo journalctl -k --since '10 minutes ago' --no-pager | grep -E 'apparmor="DENIED"|unprivileged_userns' | tail -25 || true
