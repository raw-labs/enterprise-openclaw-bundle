name: Build private candidate
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: New immutable candidate identity (never reuse)
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.repository == 'raw-labs/enterprise-openclaw-bundle' && github.event.repository.private
    runs-on: ubuntu-24.04
    environment: release-build
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Validate candidate and export pinned source
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          python3 scripts/bundle.py --release releases/pilot-baseline.json candidate --id "$RELEASE_ID" --output .work/candidate.json
          python3 scripts/bundle.py --release .work/candidate.json source --output .work/source
      - name: Authenticate to private ECR
        env:
          ECR_PREFIX: ${{ vars.ECR_PREFIX }}
        run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin "${ECR_PREFIX%%/*}"
      - name: Build all three roles and retain unqualified provenance
        env:
          ECR_PREFIX: ${{ vars.ECR_PREFIX }}
        run: python3 scripts/bundle.py --release .work/candidate.json build --source .work/source --output .work/build --registry-prefix "$ECR_PREFIX" --push
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: unqualified-candidate
          include-hidden-files: true
          path: .work/build/*.json
          retention-days: 14
