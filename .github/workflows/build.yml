name: Build private stock candidate
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: New immutable SemVer alpha.N, beta.N or rc.N identity
        required: true
        type: string
      publish:
        description: Publish checked images to private GHCR only after explicit authorization
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: candidate-${{ inputs.release_id }}
  cancel-in-progress: false
jobs:
  native:
    if: github.ref == 'refs/heads/main' && github.repository == 'raw-labs/enterprise-openclaw-bundle' && github.event.repository.private
    name: Native ${{ matrix.arch }} exports and checks
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: depot-ubuntu-24.04-16
          - arch: arm64
            runner: depot-ubuntu-24.04-arm-16
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.16.0'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Select and export our exact source
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          python3 scripts/stock.py new --id "$RELEASE_ID" --output .work/candidate.json
          python3 scripts/stock.py --selection .work/candidate.json source --output .work/source
      - name: Build three shipping OCI exports on native hardware
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/stock.py --selection .work/candidate.json build --arch "$ARCH" --source .work/source --output .work/native
      - name: Prepare exact upstream test prerequisites
        working-directory: .work/source
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y skopeo
          skopeo --version | grep -Fx 'skopeo version 1.13.3'
          corepack pnpm install --frozen-lockfile --ignore-scripts
          bash scripts/ci/setup-tools.sh k3d
          bash .github/actions/run-ci-lane/codex-sandbox.sh load
      - name: Check actual exports with confinement and no skipped tests
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/stock.py --selection .work/candidate.json check --arch "$ARCH" --source .work/source --build .work/native --logs .work/private-check-logs
      - name: Clean up owned runtime resources and policy
        if: always()
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if test -f .work/source/scripts/ci/cleanup.mjs; then
            node .work/source/scripts/ci/cleanup.mjs --state "$RUNNER_TEMP/bundle-runtime-$ARCH.json"
            bash .work/source/.github/actions/run-ci-lane/codex-sandbox.sh unload
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-proof-${{ matrix.arch }}
          path: |
            .work/native/proof
            .work/native/build-record.json
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-${{ matrix.arch }}
          path: .work/native
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
  publish:
    needs: native
    if: inputs.publish && github.ref == 'refs/heads/main' && github.repository == 'raw-labs/enterprise-openclaw-bundle' && github.event.repository.private
    runs-on: depot-ubuntu-24.04-8
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.16.0'
      - uses: Azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v3.21.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-*
          path: .work/inputs
      - name: Authenticate only the candidate publisher
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install --no-install-recommends -y skopeo
          mkdir -m 700 "$RUNNER_TEMP/registry-auth"
          printf '%s' "$REGISTRY_TOKEN" | skopeo login --authfile "$RUNNER_TEMP/registry-auth/auth.json" --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Publish the tested manifests and retain unqualified metadata
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/stock.py new --id "$RELEASE_ID" --output .work/candidate.json
          python3 scripts/stock.py --selection .work/candidate.json publish --inputs .work/inputs --output .work/published --authfile "$RUNNER_TEMP/registry-auth/auth.json"
          python3 scripts/stock.py --selection .work/published/candidate.json source --output .work/source
          python3 scripts/stock.py --selection .work/published/candidate.json dependencies --output .work/renderer-dependencies
          python3 scripts/bundle.py --release .work/published/candidate.json package --source .work/source --dependencies .work/renderer-dependencies --output dist/bundle.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: candidate-records-and-bundle
          path: |
            .work/published/*.json
            .work/published/profiles
            .work/published/defaults
            .work/published/overlays/notices.fragment
            dist/bundle.tar.gz*
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Remove job credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/registry-auth/auth.json"
